# CS330 question bank -- cards 25 through 36 of ../main.yml
#
# Schema (one entry per question):
#   id:          cNN-K   (NN = card number in main.yml, K = 1.. within that card)
#   card:        card number (1-based position in main.yml)
#   source_card: the card's title in main.yml
#   origin:      direct   = taken straight from a question printed on the card front
#                inferred = derived from the card front/back
#   tags:        what the question is about (one or more); the full vocabulary and its
#                groups are listed in index.yml
#   prompt:      markdown shown to the student
#   answer:      markdown revealed afterward

questions:
  # ---------------------------------------------------------------- card 25
  - id: c25-1
    card: 25
    source_card: "What are keys/constraints?"
    origin: direct
    tags: [conceptual, key]
    prompt: |
      What is a **primary key**?
    answer: |
      A column (or set of columns) that uniquely identifies each row. A table has exactly one primary key.

  - id: c25-2
    card: 25
    source_card: "What are keys/constraints?"
    origin: direct
    tags: [conceptual, key]
    prompt: |
      Can more than one column form a table's primary key?
    answer: |
      Yes: a primary key can span multiple columns.

  - id: c25-3
    card: 25
    source_card: "What are keys/constraints?"
    origin: direct
    tags: [conceptual, key]
    prompt: |
      What is a **composite key**?
    answer: |
      A primary key made of two or more columns together (e.g. `card_id + tag_id` in a junction table).

  - id: c25-4
    card: 25
    source_card: "What are keys/constraints?"
    origin: direct
    tags: [conceptual, constraint]
    prompt: |
      What does the `UNIQUE` constraint do?
    answer: |
      No two rows may share the same value in that column.

  - id: c25-5
    card: 25
    source_card: "What are keys/constraints?"
    origin: direct
    tags: [conceptual, constraint]
    prompt: |
      What does the `NOT NULL` constraint do?
    answer: |
      The column can never be left empty.

  - id: c25-6
    card: 25
    source_card: "What are keys/constraints?"
    origin: direct
    tags: [conceptual, constraint, insert]
    prompt: |
      What happens if you try to insert a row that violates a constraint?
    answer: |
      The database rejects the INSERT/UPDATE with an error and the row is not saved.

  # ---------------------------------------------------------------- card 26
  - id: c26-1
    card: 26
    source_card: "Syntax for constraints?"
    origin: direct
    tags: [syntax_pattern, constraint]
    prompt: |
      Write the syntax pattern for a `UNIQUE` column.
    answer: |
      ```sql
      ALTER TABLE tags ADD CONSTRAINT tags_name_unique UNIQUE (name);
      -- or inline: name TEXT UNIQUE
      ```

  - id: c26-2
    card: 26
    source_card: "Syntax for constraints?"
    origin: direct
    tags: [syntax_pattern, constraint]
    prompt: |
      Write the syntax pattern for a `NOT NULL` column.
    answer: |
      ```sql
      ALTER TABLE cards ALTER COLUMN question SET NOT NULL;
      -- or inline: question TEXT NOT NULL
      ```

  - id: c26-3
    card: 26
    source_card: "Syntax for constraints?"
    origin: direct
    tags: [syntax_pattern, constraint, key]
    prompt: |
      Write the syntax pattern for a composite primary key.
    answer: |
      ```sql
      CREATE TABLE card_tags (
        card_id INTEGER REFERENCES cards(id),
        tag_id INTEGER REFERENCES tags(id),
        PRIMARY KEY (card_id, tag_id)
      );
      ```

  - id: c26-4
    card: 26
    source_card: "Syntax for constraints?"
    origin: direct
    tags: [writing_prompt, constraint]
    prompt: |
      Ensure `tags.name` must be unique, and `cards.question` and `cards.answer` can never be null.
    answer: |
      ```sql
      ALTER TABLE tags ADD CONSTRAINT tags_name_unique UNIQUE (name);

      ALTER TABLE cards ALTER COLUMN question SET NOT NULL;
      ALTER TABLE cards ALTER COLUMN answer SET NOT NULL;
      ```

  - id: c26-5
    card: 26
    source_card: "Syntax for constraints?"
    origin: inferred
    tags: [writing_prompt, create_table, constraint]
    prompt: |
      Write one `CREATE TABLE users` statement with columns `id`, `email`, and `name` where `id` is the primary key, `email` is unique, and `name` is required.
    answer: |
      ```sql
      CREATE TABLE users (
        id INTEGER PRIMARY KEY,
        email TEXT UNIQUE,
        name TEXT NOT NULL
      );
      ```

