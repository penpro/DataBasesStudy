  # ---------------------------------------------------------------- card 33
  - id: c33-1
    card: 33
    source_card: "What is GROUP BY?"
    origin: direct
    tags: [conceptual, group_by]
    prompt: |
      What does **GROUP BY** do?
    answer: |
      It collapses rows sharing a value into one summary row per group.

  - id: c33-2
    card: 33
    source_card: "What is GROUP BY?"
    origin: direct
    tags: [conceptual, group_by, order_by]
    prompt: |
      How is GROUP BY different from ORDER BY?
    answer: |
      ORDER BY just reorders rows; it doesn't merge them. GROUP BY merges rows into groups.

  - id: c33-3
    card: 33
    source_card: "What is GROUP BY?"
    origin: direct
    tags: [conceptual, aggregate]
    prompt: |
      What are **aggregate functions**? Name a few.
    answer: |
      Functions that compute one value from many rows: `COUNT`, `SUM`, `AVG`, `MIN`, `MAX`.

  - id: c33-4
    card: 33
    source_card: "What is GROUP BY?"
    origin: direct
    tags: [conceptual, having, where, group_by]
    prompt: |
      What does **HAVING** do, and how is it different from **WHERE**?
    answer: |
      HAVING filters *groups* (after aggregation); WHERE filters individual rows (before aggregation).

  - id: c33-5
    card: 33
    source_card: "What is GROUP BY?"
    origin: direct
    tags: [conceptual, where, aggregate, having]
    prompt: |
      Why can't you filter on an aggregate with WHERE?
    answer: |
      WHERE runs before grouping happens, so the aggregate value doesn't exist yet to filter on. Use HAVING.

  # ---------------------------------------------------------------- card 34
  - id: c34-1
    card: 34
    source_card: "Syntax for GROUP BY/COUNT?"
    origin: direct
    tags: [syntax_pattern, group_by, aggregate]
    prompt: |
      Write the syntax pattern for `GROUP BY` with `COUNT`.
    answer: |
      ```sql
      SELECT deck_id, COUNT(*) AS num_cards
      FROM cards
      GROUP BY deck_id;
      ```

  - id: c34-2
    card: 34
    source_card: "Syntax for GROUP BY/COUNT?"
    origin: direct
    tags: [syntax_pattern, group_by, aggregate]
    prompt: |
      Write the syntax pattern for `GROUP BY` with more than one aggregate function.
    answer: |
      ```sql
      SELECT card_id, COUNT(*) AS times, AVG(rating) AS avg_rating, MAX(rating) AS best
      FROM reviews
      GROUP BY card_id;
      ```

  - id: c34-3
    card: 34
    source_card: "Syntax for GROUP BY/COUNT?"
    origin: direct
    tags: [writing_prompt, join, left_join, group_by, aggregate]
    prompt: |
      Write a query showing each card's question alongside how many times it has been reviewed.
    answer: |
      ```sql
      SELECT cards.question, COUNT(reviews.id) AS times_reviewed
      FROM cards
      LEFT JOIN reviews ON reviews.card_id = cards.id
      GROUP BY cards.id, cards.question;
      ```

  - id: c34-4
    card: 34
    source_card: "Syntax for GROUP BY/COUNT?"
    origin: inferred
    tags: [tracing, group_by, aggregate]
    prompt: |
      Given `cards(id, deck_id)` with rows (1,1), (2,1), (3,2), (4,1), what does `SELECT deck_id, COUNT(*) FROM cards GROUP BY deck_id;` return?
    answer: |
      Two rows: deck 1 with count 3, and deck 2 with count 1.

  - id: c34-5
    card: 34
    source_card: "Syntax for GROUP BY/COUNT?"
    origin: inferred
    tags: [conceptual, left_join, group_by, aggregate]
    prompt: |
      In a query that LEFT JOINs `cards` to `reviews` and counts how many times each card has been reviewed, why is it `COUNT(reviews.id)` and not `COUNT(*)`?
    answer: |
      With a LEFT JOIN, a card with no reviews still produces one row (with NULL review columns). `COUNT(*)` would count that row as 1; `COUNT(reviews.id)` ignores NULLs and correctly gives 0.

  # ---------------------------------------------------------------- card 35
  - id: c35-1
    card: 35
    source_card: "Syntax for HAVING?"
    origin: direct
    tags: [syntax_pattern, having, group_by]
    prompt: |
      Write the syntax pattern for `HAVING` after `GROUP BY`.
    answer: |
      ```sql
      SELECT deck_id, COUNT(*) AS num_cards
      FROM cards
      GROUP BY deck_id
      HAVING COUNT(*) > 10;
      ```

  - id: c35-2
    card: 35
    source_card: "Syntax for HAVING?"
    origin: direct
    tags: [syntax_pattern, where, group_by, having]
    prompt: |
      Write the syntax pattern combining `WHERE`, `GROUP BY`, and `HAVING` in one query.
    answer: |
      ```sql
      SELECT deck_id, COUNT(*) AS num_cards
      FROM cards
      WHERE created_at > '2026-01-01'
      GROUP BY deck_id
      HAVING COUNT(*) > 10;
      ```

  - id: c35-3
    card: 35
    source_card: "Syntax for HAVING?"
    origin: direct
    tags: [writing_prompt, join, inner_join, group_by, aggregate, having]
    prompt: |
      Write a query showing only cards whose average rating is below 3: the ones you're struggling with.
    answer: |
      ```sql
      SELECT cards.question, AVG(reviews.rating) AS avg_rating
      FROM cards
      INNER JOIN reviews ON reviews.card_id = cards.id
      GROUP BY cards.id, cards.question
      HAVING AVG(reviews.rating) < 3;
      ```

  - id: c35-4
    card: 35
    source_card: "Syntax for HAVING?"
    origin: inferred
    tags: [debugging, where, aggregate, having]
    prompt: |
      This query fails. Why, and how do you fix it?
      ```sql
      SELECT deck_id, COUNT(*) FROM cards
      WHERE COUNT(*) > 10
      GROUP BY deck_id;
      ```
    answer: |
      `WHERE` can't use an aggregate because it runs before grouping. Move the condition to `HAVING COUNT(*) > 10` after the `GROUP BY`.

  - id: c35-5
    card: 35
    source_card: "Syntax for HAVING?"
    origin: inferred
    tags: [tracing, group_by, aggregate, having]
    prompt: |
      `reviews` has (card 1: ratings 2, 3), (card 2: ratings 5, 4), (card 3: rating 1). Which card ids does `SELECT card_id FROM reviews GROUP BY card_id HAVING AVG(rating) < 3;` return?
    answer: |
      Cards 1 and 3: card 1 averages 2.5, card 3 averages 1, and card 2 averages 4.5.

