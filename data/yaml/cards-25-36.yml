      SET rating = 5
      WHERE id = 1;
      ```

  - id: c30-4
    card: 30
    source_card: "Syntax for INSERT/UPDATE?"
    origin: direct
    tags: [writing_prompt, create_table, insert]
    prompt: |
      Create `reviews`, then "study" card #1 by inserting a review with a rating and a next review date 3 days out.
    answer: |
      ```sql
      CREATE TABLE reviews (
        id INTEGER PRIMARY KEY,
        card_id INTEGER REFERENCES cards(id),
        reviewed_at TEXT,
        rating INTEGER,           -- e.g. 1 (hard) - 5 (easy)
        next_review_date TEXT
      );

      INSERT INTO reviews (card_id, reviewed_at, rating, next_review_date)
      VALUES (1, '2026-09-14', 4, '2026-09-17');
      ```

  - id: c30-5
    card: 30
    source_card: "Syntax for INSERT/UPDATE?"
    origin: inferred
    tags: [tracing, update, where]
    prompt: |
      A `reviews` table has ratings 2, 3, 5 for ids 1, 2, 3. After `UPDATE reviews SET rating = rating + 1 WHERE rating < 5;`, what are the ratings?
    answer: |
      3, 4, 5. Ids 1 and 2 matched (rating below 5) and were increased by one; id 3 was left alone.

