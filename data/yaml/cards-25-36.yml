      VALUES (1, '2026-09-14', 4, '2026-09-17');
      ```

  - id: c30-3
    card: 30
    source_card: "Syntax for INSERT/UPDATE?"
    origin: direct
    tags: [syntax_pattern, update]
    prompt: |
      Write the syntax pattern for `UPDATE`.
    answer: |
      ```sql
