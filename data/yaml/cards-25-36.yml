  - id: c27-4
    card: 27
    source_card: "Syntax for testing constraints?"
    origin: inferred
    tags: [conceptual, insert, constraint]
    prompt: |
      When an INSERT violates a constraint, what is the state of the table afterwards?
    answer: |
