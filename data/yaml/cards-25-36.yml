  - id: c27-5
    card: 27
    source_card: "Syntax for testing constraints?"
    origin: inferred
    tags: [debugging, insert, key, constraint]
    prompt: |
      What happens when you insert a second row with the same primary key value as an existing row?
    answer: |
      The insert fails with a duplicate (primary key / unique) violation, because a primary key must be unique.

  # ---------------------------------------------------------------- card 28
  - id: c28-1
    card: 28
    source_card: "Fluency with keys/constraints?"
    origin: inferred
    tags: [design, constraint, key]
    prompt: |
      A `members(id, email, name, joined_on)` table is being designed. Which columns need PRIMARY KEY, UNIQUE, and NOT NULL? Justify each.
    answer: |
      `id` is the PRIMARY KEY (identifies a row). `email` should be UNIQUE (no two members share an email) and probably NOT NULL (it is how you contact them). `name` should be NOT NULL (a member must have a name). `joined_on` can be NOT NULL if every member has a join date.

  - id: c28-2
    card: 28
    source_card: "Fluency with keys/constraints?"
    origin: inferred
    tags: [writing_prompt, create_table, constraint]
    prompt: |
      Write the full `CREATE TABLE` statement for `members(id, email, name, joined_on)` where `id` is the primary key, `email` is required and unique, and `name` and `joined_on` are required.
    answer: |
      ```sql
      CREATE TABLE members (
        id INTEGER PRIMARY KEY,
        email TEXT NOT NULL UNIQUE,
        name TEXT NOT NULL,
        joined_on TEXT NOT NULL
      );
      ```

  - id: c28-3
    card: 28
    source_card: "Fluency with keys/constraints?"
    origin: inferred
    tags: [syntax_pattern, constraint]
    prompt: |
      Write the syntax for a `CHECK` constraint that requires a `rating` column to be between 1 and 5.
    answer: |
      ```sql
      rating INTEGER CHECK (rating BETWEEN 1 AND 5)
      ```

  - id: c28-4
    card: 28
    source_card: "Fluency with keys/constraints?"
    origin: inferred
    tags: [syntax_pattern, constraint]
    prompt: |
      Write the syntax for a `DEFAULT` value that sets `joined_on` to a fixed date when none is given.
    answer: |
      ```sql
      joined_on TEXT DEFAULT '2026-01-01'
      ```

  - id: c28-5
    card: 28
    source_card: "Fluency with keys/constraints?"
    origin: inferred
    tags: [conceptual, key]
    prompt: |
      When would a composite primary key need a third column? Give an example.
    answer: |
      When the first two columns can legitimately repeat. For example, a student may take the same class in two different terms, so an `enrollments` key may need `(student_id, class_id, term)`.

  # ---------------------------------------------------------------- card 29
  - id: c29-1
    card: 29
    source_card: "What are INSERT/UPDATE/DELETE?"
    origin: direct
    tags: [conceptual, insert]
    prompt: |
      What does **INSERT** do?
    answer: |
      It adds new row(s) to a table.

  - id: c29-2
    card: 29
    source_card: "What are INSERT/UPDATE/DELETE?"
    origin: direct
    tags: [conceptual, update]
    prompt: |
      What does **UPDATE** do?
    answer: |
      It changes existing column values on matching rows.

  - id: c29-3
    card: 29
    source_card: "What are INSERT/UPDATE/DELETE?"
    origin: direct
    tags: [conceptual, delete]
    prompt: |
      What does **DELETE** do?
    answer: |
      It removes matching rows entirely.

  - id: c29-4
    card: 29
    source_card: "What are INSERT/UPDATE/DELETE?"
    origin: direct
    tags: [conceptual, update, delete, where]
    prompt: |
      Why is a `WHERE` clause critical on UPDATE and DELETE?
    answer: |
      Without `WHERE`, UPDATE and DELETE apply to every row in the table.

  - id: c29-5
    card: 29
    source_card: "What are INSERT/UPDATE/DELETE?"
    origin: direct
    tags: [conceptual, delete, where]
    prompt: |
      What happens if you run `DELETE FROM cards;` with no WHERE?
    answer: |
      It deletes every flashcard in the table (every row).

  - id: c29-6
    card: 29
    source_card: "What are INSERT/UPDATE/DELETE?"
    origin: direct
    tags: [conceptual, update, delete, select, where]
    prompt: |
      What is a safe habit for testing UPDATE/DELETE before running them for real?
    answer: |
      Run the equivalent `SELECT ... WHERE ...` first to see exactly which rows would be affected.

  # ---------------------------------------------------------------- card 30
  - id: c30-1
