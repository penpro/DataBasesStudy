    answer: |
      ```sql
      SELECT region, MIN(amount) AS smallest, MAX(amount) AS largest
      FROM sales
      GROUP BY region;
      ```

  - id: c36-5
    card: 36
    source_card: "Fluency with GROUP BY?"
    origin: inferred
    tags: [conceptual, where, group_by, having]
    prompt: |
      In a query with WHERE, GROUP BY and HAVING, in what order do they run, and why does HAVING come after WHERE?
    answer: |
      WHERE filters rows first, then GROUP BY forms groups, then HAVING filters the groups. HAVING needs the aggregates that only exist after grouping.
