questions:
  # ---------------------------------------------------------------- card 13
  - id: c13-1
    card: 13
    source_card: "What is a JOIN?"
    origin: direct
    tags: [conceptual, join]
    prompt: |
      What is a **JOIN**?
    answer: |
      It combines rows from two tables based on a matching column (e.g. `cards.deck_id = decks.id`).

  - id: c13-2
    card: 13
    source_card: "What is a JOIN?"
    origin: direct
    tags: [conceptual, join, relationship]
    prompt: |
      Why can't you get a card's deck name by querying `cards` alone?
    answer: |
      `cards` only has `deck_id`, a number. You need to JOIN to `decks` to get the deck's name.

  - id: c13-3
    card: 13
    source_card: "What is a JOIN?"
    origin: direct
    tags: [conceptual, inner_join, left_join]
    prompt: |
      What is the difference between an **INNER JOIN** and a **LEFT JOIN**?
    answer: |
      An INNER JOIN keeps only rows that match in both tables. A LEFT JOIN keeps all rows from the left table, matched or not.

  - id: c13-4
    card: 13
    source_card: "What is a JOIN?"
    origin: direct
    tags: [conceptual, left_join]
    prompt: |
      What happens to a LEFT JOIN row when there is no match on the right side?
    answer: |
      The row is kept, and the right-side columns come back as `NULL`.

  - id: c13-5
    card: 13
    source_card: "What is a JOIN?"
    origin: inferred
    tags: [tracing, inner_join, left_join]
    prompt: |
      Given these tables, how many rows does `decks LEFT JOIN cards ON cards.deck_id = decks.id` return, and how many does the INNER JOIN version return?

      `decks`: (1, 'SQL'), (2, 'Joins'), (3, 'Graphs')
      `cards`: (10, deck_id 1), (11, deck_id 1), (12, deck_id 2)
    answer: |
      The LEFT JOIN returns 4 rows: two for deck 1, one for deck 2, and one for deck 3 with `NULL` card columns. The INNER JOIN returns 3 rows (deck 3 has no cards, so it is dropped).

  # ---------------------------------------------------------------- card 14
  - id: c14-1
    card: 14
    source_card: "Syntax for INNER JOIN?"
    origin: direct
    tags: [syntax_pattern, join, inner_join]
    prompt: |
      Write the syntax pattern for an `INNER JOIN` between two tables.
    answer: |
      ```sql
      SELECT a.col, b.col
      FROM a
      INNER JOIN b ON a.fk = b.id;
      ```

  - id: c14-2
    card: 14
    source_card: "Syntax for INNER JOIN?"
    origin: direct
    tags: [syntax_pattern, join, inner_join, where]
    prompt: |
      Write the syntax pattern for an `INNER JOIN` with a `WHERE` clause.
    answer: |
      ```sql
      SELECT a.col, b.col
      FROM a
      INNER JOIN b ON a.fk = b.id
      WHERE b.col = 'x';
      ```

  - id: c14-3
    card: 14
    source_card: "Syntax for INNER JOIN?"
    origin: direct
    tags: [writing_prompt, join, inner_join]
    prompt: |
      Write a query that lists every card's question alongside the name of the deck it belongs to.
    answer: |
      ```sql
      SELECT cards.question, decks.name
      FROM cards
      INNER JOIN decks ON cards.deck_id = decks.id;
      ```

  - id: c14-4
    card: 14
    source_card: "Syntax for INNER JOIN?"
    origin: inferred
    tags: [writing_prompt, join, inner_join, where]
    prompt: |
      Write a query that lists the questions of the cards that belong to the deck named 'SQL'.
    answer: |
      ```sql
      SELECT cards.question
      FROM cards
      INNER JOIN decks ON cards.deck_id = decks.id
      WHERE decks.name = 'SQL';
      ```

  - id: c14-5
    card: 14
    source_card: "Syntax for INNER JOIN?"
    origin: inferred
    tags: [debugging, join, inner_join]
    prompt: |
      What is wrong with this query?
      ```sql
      SELECT cards.question, decks.name
      FROM cards
      INNER JOIN decks;
      ```
    answer: |
      The `ON` clause is missing, so the database can't tell which rows match. Add `ON cards.deck_id = decks.id`.

  # ---------------------------------------------------------------- card 15
  - id: c15-1
    card: 15
    source_card: "Syntax for LEFT JOIN?"
    origin: direct
    tags: [syntax_pattern, join, left_join]
    prompt: |
      Write the syntax pattern for a `LEFT JOIN`.
    answer: |
      ```sql
      SELECT a.col, b.col
      FROM a
      LEFT JOIN b ON b.fk = a.id;
      ```

  - id: c15-2
    card: 15
    source_card: "Syntax for LEFT JOIN?"
    origin: direct
    tags: [syntax_pattern, join, left_join, where]
    prompt: |
      Write the syntax pattern for finding rows with no match (`IS NULL`).
    answer: |
      ```sql
      SELECT a.col
      FROM a
      LEFT JOIN b ON b.fk = a.id
      WHERE b.id IS NULL;
      ```

  - id: c15-3
    card: 15
    source_card: "Syntax for LEFT JOIN?"
    origin: direct
    tags: [writing_prompt, join, left_join]
    prompt: |
      Write a query that lists every deck, including empty decks, alongside any card questions in it.
    answer: |
      ```sql
      SELECT decks.name, cards.question
      FROM decks
      LEFT JOIN cards ON cards.deck_id = decks.id;
      ```

  - id: c15-4
    card: 15
    source_card: "Syntax for LEFT JOIN?"
    origin: inferred
    tags: [writing_prompt, join, left_join, where]
    prompt: |
      Write a query that lists the names of decks that have no cards.
    answer: |
      ```sql
      SELECT decks.name
      FROM decks
      LEFT JOIN cards ON cards.deck_id = decks.id
      WHERE cards.id IS NULL;
      ```

  - id: c15-5
    card: 15
    source_card: "Syntax for LEFT JOIN?"
    origin: inferred
    tags: [conceptual, join, left_join, where]
    prompt: |
      Why do we test `cards.id IS NULL` rather than `cards.id = NULL` when looking for unmatched rows?
    answer: |
      `NULL` means "unknown", and comparing anything to it with `=` is never true. `IS NULL` is the correct test.

  # ---------------------------------------------------------------- card 16
  - id: c16-1
