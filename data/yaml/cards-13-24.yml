  - id: c16-5
    card: 16
    source_card: "Fluency with JOINs?"
    origin: inferred
    tags: [tracing, join]
    prompt: |
      If you remove the `ON` condition from a join of a 3-row table and a 4-row table (using a form that allows it, such as `CROSS JOIN`), how many rows come back?
