  - id: c16-6
    card: 16
    source_card: "Fluency with JOINs?"
    origin: inferred
    tags: [conceptual, join]
    prompt: |
      Which of these questions requires a JOIN to answer? (a) How many cards are there? (b) What is the name of the deck each card is in?
    answer: |
      (b). The deck name is in the `decks` table and only `deck_id` is in `cards`. Question (a) needs just `cards`.

  # ---------------------------------------------------------------- card 17
  - id: c17-1
    card: 17
    source_card: "What is normalization?"
    origin: direct
    tags: [conceptual, normalization, anomaly]
    prompt: |
      What is **redundancy** in a database? Why is it a problem?
    answer: |
      Redundancy is the same fact stored in more than one row (e.g. a tag's description copied onto every card that uses it). It wastes space and lets the copies disagree with each other.

  - id: c17-2
    card: 17
    source_card: "What is normalization?"
    origin: direct
    tags: [conceptual, anomaly]
    prompt: |
      What is an **update anomaly**?
    answer: |
      Fixing a typo in a duplicated fact requires updating many rows. Miss one, and the data disagrees with itself.

  - id: c17-3
    card: 17
    source_card: "What is normalization?"
    origin: direct
    tags: [conceptual, anomaly]
    prompt: |
      What is a **delete anomaly**?
    answer: |
      Deleting the only row that references some information deletes that information entirely, even if it is unrelated to what you meant to delete.

  - id: c17-4
    card: 17
    source_card: "What is normalization?"
    origin: direct
    tags: [conceptual, normalization]
    prompt: |
      What is **normalization**?
    answer: |
      Organizing tables to minimize redundancy and prevent update and delete anomalies.

  - id: c17-5
    card: 17
    source_card: "What is normalization?"
    origin: direct
    tags: [conceptual, normalization, join]
    prompt: |
      What is the trade-off of normalizing "too much"?
    answer: |
      Over-normalizing means more JOINs are needed to answer simple questions, a real performance and complexity cost.

  - id: c17-6
    card: 17
    source_card: "What is normalization?"
    origin: inferred
    tags: [debugging, normalization, anomaly]
    prompt: |
      In this table, which columns are redundant, and which fact is repeated?

      | order_id | item | customer_name | customer_address |
      |---|---|---|---|
      | 1 | Pen | Ada | 12 Oak St |
      | 2 | Ink | Ada | 12 Oak St |
      | 3 | Pad | Grace | 9 Elm Ave |
    answer: |
      `customer_name` and `customer_address` are redundant: Ada's address is stored once per order. The customer facts belong in a separate `customers` table.

  # ---------------------------------------------------------------- card 18
  - id: c18-1
    card: 18
    source_card: "Syntax for spotting redundancy?"
    origin: direct
    tags: [syntax_pattern, create_table, normalization]
    prompt: |
      Write a `cards` table that stores a tag name and tag description directly on every row (no `tags` table): an "unnormalized" version.
    answer: |
      ```sql
      CREATE TABLE cards_flat (
        id INTEGER PRIMARY KEY,
        question TEXT,
        tag_name TEXT,
        tag_description TEXT
      );
      ```

  - id: c18-2
    card: 18
    source_card: "Syntax for spotting redundancy?"
    origin: direct
    tags: [conceptual, normalization, anomaly]
    prompt: |
      In `cards_flat (id, question, tag_name, tag_description)`, identify which columns are redundant.
    answer: |
      `tag_name` and `tag_description` are repeated on every card that has that tag. The description depends on the tag, not on the card.

  - id: c18-3
    card: 18
    source_card: "Syntax for spotting redundancy?"
    origin: direct
    tags: [writing_prompt, insert, anomaly]
    prompt: |
      Write two `INSERT` statements for `cards_flat (id, question, tag_name, tag_description)` that set up an update anomaly: both cards carry the same `tag_name`, but its description is typed two different ways.
    answer: |
      ```sql
      INSERT INTO cards_flat VALUES
        (1, 'What is a for-loop?', 'loops',
            'Repeats code a fixed number of times'),
        (2, 'What is a while-loop?', 'loops',
            'Repeats code while a condition holds');
      ```
      The same tag now has two different descriptions.

  - id: c18-4
    card: 18
    source_card: "Syntax for spotting redundancy?"
    origin: inferred
    tags: [conceptual, anomaly]
    prompt: |
      Two rows are inserted into `cards_flat (id, question, tag_name, tag_description)`. Both have the `tag_name` 'loops', but one has the description 'Repeats code a fixed number of times' and the other 'Repeats code while a condition holds'. What is the "truth" about the description of the `loops` tag?
    answer: |
      There is no single answer: the table now disagrees with itself. That is the problem an update anomaly causes.

  - id: c18-5
    card: 18
    source_card: "Syntax for spotting redundancy?"
    origin: inferred
    tags: [tracing, anomaly, update]
    prompt: |
      1,000 rows in `cards_flat` carry the tag `loops` with the same description. How many rows must be updated to change that description? How many once it is in a `tags` table?
    answer: |
      1,000 rows in `cards_flat`. In a normalized `tags` table it is stored once, so one row.

  # ---------------------------------------------------------------- card 19
  - id: c19-1
    card: 19
    source_card: "Syntax for splitting a table?"
    origin: direct
    tags: [syntax_pattern, create_table, normalization, relationship]
    prompt: |
      Write the syntax pattern for creating a normalized replacement of a flat table (two tables plus a foreign key).
    answer: |
      ```sql
      CREATE TABLE tags (
        id INTEGER PRIMARY KEY,
        name TEXT,
        description TEXT
      );

      ALTER TABLE cards ADD COLUMN tag_id INTEGER REFERENCES tags(id);
      ```

  - id: c19-2
    card: 19
    source_card: "Syntax for splitting a table?"
    origin: direct
    tags: [syntax_pattern, update, normalization]
    prompt: |
      Write the syntax pattern for migrating data with `UPDATE`.
    answer: |
      ```sql
      UPDATE cards SET tag_id = 1 WHERE question LIKE '%loop%';
      ```

  - id: c19-3
    card: 19
    source_card: "Syntax for splitting a table?"
    origin: direct
    tags: [writing_prompt, create_table, insert, update, normalization]
    prompt: |
      Refactor `cards_flat` into `tags` (id, name, description) and a `cards` table that references one tag by id.
    answer: |
      ```sql
      CREATE TABLE tags (
        id INTEGER PRIMARY KEY,
        name TEXT,
        description TEXT
      );

      ALTER TABLE cards ADD COLUMN tag_id INTEGER REFERENCES tags(id);

      INSERT INTO tags (id, name, description)
      VALUES (1, 'loops', 'Repeats code while a condition holds');

      UPDATE cards SET tag_id = 1 WHERE question LIKE '%loop%';
      ```

  - id: c19-4
    card: 19
    source_card: "Syntax for splitting a table?"
    origin: inferred
    tags: [conceptual, normalization, update]
    prompt: |
      After `cards_flat` has been refactored into a `tags` table and a `cards` table that references it by `tag_id`, how do you correct the description of the `loops` tag?
    answer: |
      With one update of one row:
      ```sql
      UPDATE tags SET description = 'Repeats code' WHERE id = 1;
      ```

  - id: c19-5
    card: 19
    source_card: "Syntax for splitting a table?"
    origin: inferred
    tags: [conceptual, update, where]
    prompt: |
      What does `WHERE question LIKE '%loop%'` match in the migration `UPDATE`?
    answer: |
      Every card whose question contains the text "loop" anywhere in it (`%` matches any run of characters).

  # ---------------------------------------------------------------- card 20
  - id: c20-1
    card: 20
    source_card: "Fluency with anomalies?"
    origin: inferred
    tags: [debugging, normalization, anomaly]
    prompt: |
      An `orders` table has columns `(order_id, product, customer_name, customer_address)`. Which columns are redundant, and why?
    answer: |
      `customer_name` and `customer_address` repeat on every order that customer places, so the customer's facts are stored many times.

  - id: c20-2
    card: 20
    source_card: "Fluency with anomalies?"
    origin: inferred
    tags: [writing_prompt, update, anomaly]
    prompt: |
      A flat `orders` table has the columns `(order_id, product, customer_name, customer_address)`. Show how an update anomaly could occur when the customer Ada moves to a new address.
    answer: |
      ```sql
      UPDATE orders SET customer_address = '5 Pine Rd'
      WHERE order_id = 1;
      ```
      Only order 1 was changed; Ada's other orders still list the old address, so the table now holds two addresses for one customer.

  - id: c20-3
    card: 20
    source_card: "Fluency with anomalies?"
    origin: inferred
    tags: [writing_prompt, delete, anomaly]
    prompt: |
      A flat `orders` table has the columns `(order_id, product, customer_name, customer_address)`. Write a `DELETE` that would cause a delete anomaly.
    answer: |
      ```sql
      DELETE FROM orders WHERE order_id = 3;
      ```
      If order 3 is the only order for a customer (say Grace), deleting it also deletes everything the table knew about Grace, including her address.

  - id: c20-4
    card: 20
    source_card: "Fluency with anomalies?"
    origin: inferred
    tags: [tracing, anomaly]
    prompt: |
      A customer's address is repeated in 40 orders. How many times does that fact appear, and how many rows must change if the address changes?
    answer: |
      40 times; 40 rows.

  - id: c20-5
    card: 20
    source_card: "Fluency with anomalies?"
    origin: inferred
    tags: [design, normalization, create_table]
    prompt: |
      Normalize the flat `orders` table `(order_id, product, customer_name, customer_address)` into separate tables.
    answer: |
      ```sql
      CREATE TABLE customers (
        id INTEGER PRIMARY KEY,
        name TEXT,
        address TEXT
      );

      CREATE TABLE orders (
        order_id INTEGER PRIMARY KEY,
        product TEXT,
        customer_id INTEGER REFERENCES customers(id)
      );
      ```

  # ---------------------------------------------------------------- card 21
  - id: c21-1
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: direct
    tags: [conceptual, normalization]
    prompt: |
      What is **First Normal Form (1NF)**?
    answer: |
      Every column holds a single value: no comma-separated lists in one cell (e.g. no `tags = "loops, syntax"`).

  - id: c21-2
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: direct
    tags: [conceptual, normalization]
    prompt: |
      In 1NF, what does "atomic" mean?
    answer: |
      A value that can't be meaningfully divided further: one value per cell, not a list.

  - id: c21-3
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: direct
    tags: [conceptual, normalization, key]
    prompt: |
      What is **Second Normal Form (2NF)**?
    answer: |
      1NF, plus every non-key column depends on the *whole* primary key. This matters for multi-column keys.

  - id: c21-4
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: direct
    tags: [conceptual, normalization]
    prompt: |
      What is **Third Normal Form (3NF)**?
    answer: |
      2NF, plus no non-key column depends on another non-key column (e.g. don't store `tag_category` derived from `tag_name` directly on `cards`).

  - id: c21-5
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: direct
    tags: [debugging, normalization]
    prompt: |
      Give an example of data that violates 1NF.
    answer: |
      A `cards` table with a `tags` column containing `"loops, syntax"` in one cell: a card can have more than one tag.

  - id: c21-6
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: inferred
    tags: [debugging, normalization, key]
    prompt: |
      A table `order_items (order_id, product_id, product_name, quantity)` has the composite primary key `(order_id, product_id)`. Which normal form does it violate and why?
    answer: |
      2NF. `product_name` depends only on `product_id`, which is just part of the key. It should live in a `products` table.

  - id: c21-7
    card: 21
    source_card: "What are 1NF/2NF/3NF?"
    origin: inferred
    tags: [debugging, normalization]
    prompt: |
      A `cards` table stores both `tag_name` and `tag_category`, where the category is determined by the tag name. Which normal form does it violate?
    answer: |
      3NF: `tag_category` depends on another non-key column (`tag_name`) rather than directly on the key.

  # ---------------------------------------------------------------- card 22
  - id: c22-1
    card: 22
    source_card: "Syntax for fixing 1NF violations?"
    origin: direct
    tags: [syntax_pattern, create_table, relationship, normalization]
    prompt: |
      Write the syntax pattern for a junction table that replaces a comma-separated column.
    answer: |
      ```sql
      CREATE TABLE card_tags (
        card_id INTEGER REFERENCES cards(id),
        tag_id INTEGER REFERENCES tags(id),
        PRIMARY KEY (card_id, tag_id)
      );
      ```

  - id: c22-2
    card: 22
    source_card: "Syntax for fixing 1NF violations?"
    origin: direct
    tags: [syntax_pattern, insert, relationship]
    prompt: |
      Write the syntax pattern for inserting into a junction table.
    answer: |
      ```sql
      INSERT INTO card_tags (card_id, tag_id) VALUES (1, 1), (1, 2);
      ```

  - id: c22-3
    card: 22
    source_card: "Syntax for fixing 1NF violations?"
    origin: direct
    tags: [writing_prompt, create_table, insert, normalization, relationship]
    prompt: |
      A `cards` table has a `tags` column like `'loops, syntax'`. Refactor it into `tags` and `card_tags` (junction) tables so one card can have many tags.
    answer: |
      ```sql
      CREATE TABLE tags (
        id INTEGER PRIMARY KEY,
        name TEXT UNIQUE
      );

      CREATE TABLE card_tags (
        card_id INTEGER REFERENCES cards(id),
        tag_id INTEGER REFERENCES tags(id),
        PRIMARY KEY (card_id, tag_id)
      );

      INSERT INTO tags (id, name) VALUES (1, 'loops'), (2, 'syntax');
      INSERT INTO card_tags (card_id, tag_id) VALUES (1, 1), (1, 2);
      ```

  - id: c22-4
    card: 22
    source_card: "Syntax for fixing 1NF violations?"
    origin: inferred
    tags: [conceptual, key, constraint]
    prompt: |
      Why is the primary key of `card_tags` the pair `(card_id, tag_id)`?
    answer: |
      Each card/tag pair should appear at most once, and the pair itself uniquely identifies the row: it is a composite key.

  - id: c22-5
    card: 22
    source_card: "Syntax for fixing 1NF violations?"
    origin: inferred
    tags: [conceptual, normalization]
    prompt: |
      Why is a comma-separated `tags` column hard to work with, even before thinking about normal forms?
    answer: |
      You can't easily find all cards with a given tag, count tags, or enforce that tags exist: the database sees one text value, not separate values.

