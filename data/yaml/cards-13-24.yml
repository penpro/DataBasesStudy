  - id: c24-1
    card: 24
    source_card: "Fluency with normal forms?"
    origin: inferred
    tags: [design, create_table, relationship, er_modeling]
    prompt: |
      Students take many classes and classes have many students. Design the tables, including the junction table.
    answer: |
      ```sql
      CREATE TABLE students (id INTEGER PRIMARY KEY, name TEXT);
      CREATE TABLE classes  (id INTEGER PRIMARY KEY, title TEXT);
      CREATE TABLE enrollments (
        student_id INTEGER REFERENCES students(id),
        class_id INTEGER REFERENCES classes(id),
        PRIMARY KEY (student_id, class_id)
      );
      ```

  - id: c24-2
    card: 24
    source_card: "Fluency with normal forms?"
    origin: inferred
    tags: [writing_prompt, join, inner_join, relationship]
    prompt: |
      Write a query joining through `enrollments` that lists each student's name with the titles of their classes.
    answer: |
      ```sql
      SELECT students.name, classes.title
      FROM students
      INNER JOIN enrollments ON enrollments.student_id = students.id
      INNER JOIN classes ON classes.id = enrollments.class_id;
      ```

