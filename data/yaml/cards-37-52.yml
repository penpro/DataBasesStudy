      ```

  - id: c42-5
    card: 42
    source_card: "Syntax for document queries?"
    origin: inferred
    tags: [syntax_pattern, document_db]
    prompt: |
      Write a Mongo-style statement that adds this card to the `cards` collection: `_id` 1, question "What is a JOIN?", answer "Combines rows from two tables on a matching column.", tags "syntax" and "joins".
    answer: |
      ```js
      db.cards.insertOne({
        "_id": 1,
        "question": "What is a JOIN?",
        "answer": "Combines rows from two tables on a matching column.",
        "tags": ["syntax", "joins"]
      })
      ```

  # ---------------------------------------------------------------- card 43
  - id: c43-1
    card: 43
    source_card: "Syntax for key-value lookups?"
    origin: direct
    tags: [syntax_pattern, key_value]
    prompt: |
      Write the syntax pattern for setting a key-value pair.
    answer: |
      ```text
      SET card:1:due_today true
      ```

  - id: c43-2
    card: 43
    source_card: "Syntax for key-value lookups?"
    origin: direct
    tags: [syntax_pattern, key_value]
    prompt: |
      Write the syntax pattern for getting a value by key.
    answer: |
      ```text
      GET card:1:due_today
      -- -> true
      ```

  - id: c43-3
    card: 43
    source_card: "Syntax for key-value lookups?"
    origin: direct
    tags: [writing_prompt, key_value]
    prompt: |
      Use a key-value store to cache "card #1 is due today" so the app doesn't have to query `reviews` every time it renders the study screen.
    answer: |
      ```text
      SET card:1:due_today true
      GET card:1:due_today
      -- -> true

      DEL card:1:due_today
      ```

  - id: c43-4
    card: 43
    source_card: "Syntax for key-value lookups?"
    origin: inferred
    tags: [syntax_pattern, key_value]
    prompt: |
      Write the syntax pattern for removing a key.
    answer: |
      ```text
      DEL card:1:due_today
      ```

  - id: c43-5
    card: 43
    source_card: "Syntax for key-value lookups?"
    origin: inferred
    tags: [conceptual, key_value]
    prompt: |
      Why is it useful to cache the "due today" flag in a key-value store instead of querying `reviews` each time?
    answer: |
      A key-value lookup is a single fast read by key, while the query would have to search and filter the `reviews` table every time the study screen renders.

  - id: c43-6
    card: 43
    source_card: "Syntax for key-value lookups?"
    origin: inferred
    tags: [conceptual, key_value]
    prompt: |
      In the key `card:1:due_today`, what is the colon-separated naming convention doing?
    answer: |
      It encodes structure in a flat key space: the type of thing (`card`), its id (`1`), and the field (`due_today`), so keys stay unique and easy to guess.

  # ---------------------------------------------------------------- card 44
  - id: c44-1
    card: 44
    source_card: "Fluency with document/KV stores?"
    origin: inferred
    tags: [design, document_db]
    prompt: |
      Design a "recipe" domain as an embedded document instead of normalized tables. What would you nest?
    answer: |
      One document per recipe with its ingredients nested inside, e.g. `{ "name": "Pancakes", "ingredients": [ { "item": "flour", "qty": "2 cups" }, ... ], "steps": [ ... ] }`.

  - id: c44-2
    card: 44
    source_card: "Fluency with document/KV stores?"
    origin: inferred
    tags: [conceptual, key_value]
    prompt: |
      Identify one piece of data in a recipe app you would cache in a key-value store, and why.
    answer: |
      For example "recipe of the day" or a user's session: it is read very often and by one simple key, so a fast key-value lookup avoids hitting the main database.

  - id: c44-3
    card: 44
    source_card: "Fluency with document/KV stores?"
    origin: inferred
    tags: [conceptual, document_db]
    prompt: |
      A recipe app stores each recipe as one document with its ingredients embedded inside it. When would that design start to break down as the app grows?
    answer: |
      When the same data (e.g. an ingredient's details) is embedded in many documents, so changing it means editing every copy, or when you need to query across recipes by shared ingredients.

  - id: c44-4
    card: 44
    source_card: "Fluency with document/KV stores?"
    origin: inferred
    tags: [design, document_db]
    prompt: |
      A recipe app stores each recipe as one document. Write a second recipe document with a slightly different shape from `{ "name": "Pancakes", "ingredients": [...], "steps": [...] }`, and say what stays flexible.
    answer: |
      For example a recipe with an extra `"serves": 4` field and no `"steps"`. Documents in a collection don't have to share the same fields.

  - id: c44-5
    card: 44
    source_card: "Fluency with document/KV stores?"
    origin: inferred
    tags: [design, relational, join, normalization]
    prompt: |
      A recipe app stores each recipe as one document with its ingredients and steps embedded. If you rewrote that design as normalized tables, which tables would you need and how many JOINs would reading one full recipe take?
    answer: |
      At least `recipes`, `ingredients`, and a junction table `recipe_ingredients` (plus `steps` if they are kept): reading a full recipe takes about two or three JOINs.

  # ---------------------------------------------------------------- card 45
  - id: c45-1
    card: 45
    source_card: "What is a graph database?"
    origin: direct
    tags: [conceptual, graph_db]
    prompt: |
      What is a **node** in a graph database?
    answer: |
      An entity (e.g. a Card, a Tag, a Deck).

  - id: c45-2
    card: 45
    source_card: "What is a graph database?"
    origin: direct
    tags: [conceptual, graph_db]
    prompt: |
      What is an **edge** in a graph database?
    answer: |
      A labeled, directed relationship connecting two nodes (e.g. `TAGGED`, `PREREQUISITE_OF`).

  - id: c45-3
    card: 45
    source_card: "What is a graph database?"
    origin: direct
    tags: [conceptual, graph_db, relational, join]
    prompt: |
      How is a graph database different from a relational database with foreign keys?
    answer: |
      Relational stores relationships as foreign key *values*; graphs store relationships as first-class connections you can traverse directly, without JOINs.

  - id: c45-4
    card: 45
    source_card: "What is a graph database?"
    origin: direct
    tags: [conceptual, graph_db]
    prompt: |
      What kind of question is a graph database especially good at answering?
    answer: |
      Questions about deep or variable-length connections, e.g. "every card you should review before this one, and everything before those."

  - id: c45-5
    card: 45
    source_card: "What is a graph database?"
    origin: direct
    tags: [conceptual, graph_db]
    prompt: |
      Give an example of a node and an edge in this flashcard domain.
    answer: |
      Node: `(Card)` or `(Tag)`. Edge: `(Card)-[:PREREQUISITE_OF]->(Card)` or `(Card)-[:TAGGED]->(Tag)`.

  # ---------------------------------------------------------------- card 46
  - id: c46-1
    card: 46
    source_card: "Syntax for graph nodes/edges?"
    origin: direct
    tags: [syntax_pattern, graph_db]
    prompt: |
      Write the syntax pattern (Cypher-style) for creating a node.
    answer: |
      ```cypher
      CREATE (a:Card {question: 'What is a loop?'})
      ```

  - id: c46-2
    card: 46
    source_card: "Syntax for graph nodes/edges?"
    origin: direct
    tags: [syntax_pattern, graph_db]
    prompt: |
      Write the syntax pattern for creating an edge between two nodes.
    answer: |
      ```cypher
      CREATE (a)-[:PREREQUISITE_OF]->(b)
      ```

  - id: c46-3
    card: 46
    source_card: "Syntax for graph nodes/edges?"
    origin: direct
    tags: [writing_prompt, graph_db]
    prompt: |
      Create two Card nodes ("What is a loop?" and "What is a nested loop?") and a `PREREQUISITE_OF` edge showing the first must be learned before the second.
    answer: |
      ```cypher
      CREATE (a:Card {question: 'What is a loop?'})
      CREATE (b:Card {question: 'What is a nested loop?'})
      CREATE (a)-[:PREREQUISITE_OF]->(b)
      ```

  - id: c46-4
    card: 46
    source_card: "Syntax for graph nodes/edges?"
    origin: inferred
    tags: [conceptual, graph_db]
    prompt: |
      In `(a)-[:PREREQUISITE_OF]->(b)`, which card must be learned first, and what does the arrow's direction mean?
    answer: |
      `a` must be learned first. The arrow runs from `a` to `b`, so the relationship reads "a is a prerequisite of b".

  - id: c46-5
    card: 46
    source_card: "Syntax for graph nodes/edges?"
    origin: inferred
    tags: [conceptual, graph_db]
    prompt: |
      In `(a:Card {question: 'What is a loop?'})`, what are `a`, `Card`, and the braces?
    answer: |
      `a` is a variable naming the node, `Card` is its label (its type), and the braces hold its properties (here `question`).

  - id: c46-6
    card: 46
    source_card: "Syntax for graph nodes/edges?"
    origin: inferred
    tags: [writing_prompt, graph_db]
    prompt: |
      Card nodes "What is a loop?" and "What is a nested loop?" are linked by a `PREREQUISITE_OF` edge. Add a third card "What is recursion?" that has "What is a nested loop?" as a prerequisite.
    answer: |
      ```cypher
      MATCH (b:Card {question: 'What is a nested loop?'})
      CREATE (c:Card {question: 'What is recursion?'})
      CREATE (b)-[:PREREQUISITE_OF]->(c)
      ```

  # ---------------------------------------------------------------- card 47
  - id: c47-1
    card: 47
    source_card: "Syntax for graph pattern matching?"
    origin: direct
    tags: [syntax_pattern, graph_db]
    prompt: |
      Write the syntax pattern for matching a simple relationship.
    answer: |
      ```cypher
      MATCH (a:Card)-[:PREREQUISITE_OF]->(b:Card)
      RETURN a.question, b.question;
      ```

  - id: c47-2
    card: 47
    source_card: "Syntax for graph pattern matching?"
    origin: direct
    tags: [syntax_pattern, graph_db]
    prompt: |
      Write the syntax pattern for a multi-hop match (a prerequisite chain).
    answer: |
      ```cypher
      MATCH (a:Card)-[:PREREQUISITE_OF*]->(b:Card)
      RETURN a.question, b.question;
      ```

  - id: c47-3
    card: 47
    source_card: "Syntax for graph pattern matching?"
    origin: direct
    tags: [writing_prompt, graph_db]
    prompt: |
      Write a query that finds every direct prerequisite of "What is a nested loop?".
    answer: |
      ```cypher
      MATCH (prereq:Card)-[:PREREQUISITE_OF]->
            (:Card {question: 'What is a nested loop?'})
      RETURN prereq.question;
      ```

  - id: c47-4
    card: 47
    source_card: "Syntax for graph pattern matching?"
    origin: direct
    tags: [writing_prompt, graph_db]
    prompt: |
      Write a query that finds the *entire* chain of prerequisites of "What is a nested loop?", however many hops deep.
    answer: |
      ```cypher
      MATCH (prereq:Card)-[:PREREQUISITE_OF*]->
            (:Card {question: 'What is a nested loop?'})
      RETURN DISTINCT prereq.question;
      ```

  - id: c47-5
    card: 47
    source_card: "Syntax for graph pattern matching?"
    origin: inferred
    tags: [conceptual, graph_db]
    prompt: |
      What does the `*` in `-[:PREREQUISITE_OF*]->` mean?
    answer: |
      Follow that kind of edge any number of times (one or more hops), so the pattern walks the whole chain.

  - id: c47-6
    card: 47
    source_card: "Syntax for graph pattern matching?"
    origin: inferred
    tags: [conceptual, graph_db]
    prompt: |
      Why does the chain query use `RETURN DISTINCT`?
    answer: |
      A card can be reachable by more than one path, so without `DISTINCT` it could be returned several times.

  # ---------------------------------------------------------------- card 48
  - id: c48-1
    card: 48
    source_card: "Fluency with graph databases?"
    origin: inferred
    tags: [design, graph_db, er_modeling]
    prompt: |
      Sketch the nodes and edges for a "course prerequisites" domain.
    answer: |
