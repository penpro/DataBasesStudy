    source_card: "Fluency in databases?"
    origin: inferred
    tags: [conceptual, app_architecture]
    prompt: |
      How might an app's data architecture need to change if it went from 100 users to 1,000,000?
    answer: |
      Likely: caching with a key-value store, connection pooling, read replicas or sharding for the main database, and moving hot or high-volume features to a store better suited to that access pattern.

