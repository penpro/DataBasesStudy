# CS330 question bank -- cards 37 through 52 of ../main.yml
#
# Schema (one entry per question):
#   id:          cNN-K   (NN = card number in main.yml, K = 1.. within that card)
#   card:        card number (1-based position in main.yml)
#   source_card: the card's title in main.yml
#   origin:      direct   = taken straight from a question printed on the card front
#                inferred = derived from the card front/back
#   tags:        what the question is about (one or more); the full vocabulary and its
#                groups are listed in index.yml
#   prompt:      markdown shown to the student
#   answer:      markdown revealed afterward

questions:
  # ---------------------------------------------------------------- card 37
  - id: c37-1
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, subquery]
    prompt: |
      What is a **subquery**?
    answer: |
      A query nested inside another query.

  - id: c37-2
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, subquery]
    prompt: |
      Where can a subquery appear?
    answer: |
      Often in `WHERE`, `FROM`, or `SELECT`.

  - id: c37-3
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, subquery]
    prompt: |
      What is a **correlated subquery**? How is it different from a regular subquery?
    answer: |
      A correlated subquery references a column from the outer query, so it re-runs once per outer row. A regular subquery doesn't depend on the outer query and runs once.

  - id: c37-4
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, set_operation]
    prompt: |
      What does **UNION** do?
    answer: |
      It combines the results of two queries, removing duplicates.

  - id: c37-5
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, set_operation]
    prompt: |
      What does **INTERSECT** do?
    answer: |
      It returns only rows that appear in both queries' results.

  - id: c37-6
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, set_operation]
    prompt: |
      What does **EXCEPT** do?
    answer: |
      It returns rows in the first query's results but not the second's.

  - id: c37-7
    card: 37
    source_card: "What are subqueries?"
    origin: direct
    tags: [conceptual, subquery, join]
    prompt: |
      When would you reach for a subquery instead of a JOIN?
    answer: |
      When the question is naturally "rows where some condition about *other* rows holds", e.g. "cards never reviewed".

  # ---------------------------------------------------------------- card 38
  - id: c38-1
    card: 38
    source_card: "Syntax for subqueries?"
    origin: direct
    tags: [syntax_pattern, subquery, where]
    prompt: |
      Write the syntax pattern for a subquery inside a `WHERE ... IN`.
    answer: |
      ```sql
      SELECT question FROM cards
      WHERE id IN (
        SELECT card_id FROM reviews
      );
      ```

  - id: c38-2
    card: 38
    source_card: "Syntax for subqueries?"
    origin: direct
    tags: [syntax_pattern, subquery, where]
    prompt: |
      Write the syntax pattern for a subquery inside a `WHERE ... NOT IN`.
    answer: |
      ```sql
      SELECT question FROM cards
      WHERE id NOT IN (
        SELECT card_id FROM reviews
      );
      ```

  - id: c38-3
    card: 38
    source_card: "Syntax for subqueries?"
    origin: direct
    tags: [writing_prompt, subquery, where]
    prompt: |
      Write a query that finds every card that has never been reviewed.
    answer: |
      ```sql
      SELECT question FROM cards
      WHERE id NOT IN (
        SELECT card_id FROM reviews
      );
      ```

  - id: c38-4
    card: 38
    source_card: "Syntax for subqueries?"
    origin: inferred
    tags: [tracing, subquery]
    prompt: |
      `cards` has ids 1, 2, 3, 4 and `reviews.card_id` contains 1, 1, 3. Which cards does the "never reviewed" query return?
    answer: |
      Cards 2 and 4.

  - id: c38-5
    card: 38
    source_card: "Syntax for subqueries?"
    origin: inferred
    tags: [writing_prompt, subquery, left_join, join]
    prompt: |
      Rewrite the "never reviewed" query using a LEFT JOIN instead of a subquery.
    answer: |
      ```sql
      SELECT cards.question
      FROM cards
      LEFT JOIN reviews ON reviews.card_id = cards.id
      WHERE reviews.id IS NULL;
      ```

  # ---------------------------------------------------------------- card 39
  - id: c39-1
    card: 39
    source_card: "Syntax for UNION/set operations?"
    origin: direct
    tags: [syntax_pattern, set_operation]
    prompt: |
      Write the syntax pattern for `UNION` between two SELECTs.
    answer: |
      ```sql
      SELECT question FROM cards WHERE deck_id = 1
      UNION
      SELECT question FROM cards WHERE deck_id = 2;
      ```

  - id: c39-2
    card: 39
    source_card: "Syntax for UNION/set operations?"
    origin: direct
    tags: [syntax_pattern, set_operation]
    prompt: |
      Write the syntax pattern for `INTERSECT`.
    answer: |
      ```sql
      SELECT question FROM cards WHERE deck_id = 1
      INTERSECT
      SELECT question FROM cards WHERE rating >= 4;
      ```

  - id: c39-3
    card: 39
    source_card: "Syntax for UNION/set operations?"
    origin: direct
    tags: [writing_prompt, set_operation, subquery, group_by, having]
    prompt: |
      Write a query returning a "needs attention" study queue: cards due for review on or before 2026-09-14 OR cards with an average rating below 3.
    answer: |
      ```sql
      SELECT question FROM cards
      WHERE id IN (
        SELECT card_id FROM reviews
        WHERE next_review_date <= '2026-09-14'
      )
      UNION
      SELECT question FROM cards
      WHERE id IN (
        SELECT card_id FROM reviews
        GROUP BY card_id
        HAVING AVG(rating) < 3
      );
      ```

  - id: c39-4
    card: 39
    source_card: "Syntax for UNION/set operations?"
    origin: inferred
    tags: [conceptual, set_operation]
    prompt: |
      What is the difference between `UNION` and `UNION ALL`?
    answer: |
      `UNION` removes duplicate rows from the combined result; `UNION ALL` keeps every row, duplicates included.

  - id: c39-5
    card: 39
    source_card: "Syntax for UNION/set operations?"
    origin: inferred
    tags: [tracing, set_operation]
    prompt: |
      Query A returns {1, 2, 3} and query B returns {2, 3, 4}. What do `UNION`, `INTERSECT`, and `A EXCEPT B` return?
    answer: |
      `UNION` = {1, 2, 3, 4}; `INTERSECT` = {2, 3}; `A EXCEPT B` = {1}.

  # ---------------------------------------------------------------- card 40
  - id: c40-1
    card: 40
    source_card: "Fluency with subqueries/set ops?"
    origin: inferred
    tags: [writing_prompt, subquery, where]
    prompt: |
      Given `products(id, name)` and `order_items(product_id, order_id)`, write a query for products that were never ordered.
    answer: |
      ```sql
      SELECT name FROM products
      WHERE id NOT IN (SELECT product_id FROM order_items);
      ```

  - id: c40-2
    card: 40
    source_card: "Fluency with subqueries/set ops?"
    origin: inferred
    tags: [writing_prompt, set_operation]
    prompt: |
      Write a UNION that combines "customers in Seattle" and "customers with more than 5 orders" into one list of names. Use `customers(name, city, order_count)`.
    answer: |
      ```sql
      SELECT name FROM customers WHERE city = 'Seattle'
      UNION
      SELECT name FROM customers WHERE order_count > 5;
      ```

  - id: c40-3
    card: 40
    source_card: "Fluency with subqueries/set ops?"
    origin: inferred
    tags: [writing_prompt, subquery, where]
    prompt: |
      Given `products(id, name)` and `order_items(product_id, order_id)`, write a `WHERE ... IN` subquery that finds products that *were* ordered, and say how the result relates to the products a `NOT IN` version returns.
    answer: |
      ```sql
      SELECT name FROM products
      WHERE id IN (SELECT product_id FROM order_items);
      ```
      It returns exactly the products the `NOT IN` version leaves out.

  - id: c40-4
    card: 40
    source_card: "Fluency with subqueries/set ops?"
    origin: inferred
    tags: [writing_prompt, set_operation]
    prompt: |
      Use `EXCEPT` to find product ids that appear in `products` but not in `order_items`.
    answer: |
      ```sql
      SELECT id FROM products
      EXCEPT
      SELECT product_id FROM order_items;
      ```

  - id: c40-5
    card: 40
    source_card: "Fluency with subqueries/set ops?"
    origin: inferred
    tags: [writing_prompt, subquery, where, aggregate]
    prompt: |
      Write a correlated subquery that finds each employee earning more than the average salary of their own department. Use `employees(id, name, dept, salary)`.
    answer: |
      ```sql
      SELECT name FROM employees e
      WHERE salary > (
        SELECT AVG(salary) FROM employees
        WHERE dept = e.dept
      );
      ```

  # ---------------------------------------------------------------- card 41
  - id: c41-1
    card: 41
    source_card: "What are document/KV stores?"
    origin: direct
    tags: [conceptual, document_db]
    prompt: |
      What is a **document database**?
    answer: |
      A database that stores flexible, JSON-like documents (e.g. MongoDB); each document can have its own shape.

  - id: c41-2
    card: 41
    source_card: "What are document/KV stores?"
    origin: direct
    tags: [conceptual, document_db, relational]
    prompt: |
      How does a "document" differ from a row?
    answer: |
      A document can nest related data inside itself; a row points to related data in other tables via foreign keys.

  - id: c41-3
    card: 41
    source_card: "What are document/KV stores?"
    origin: direct
    tags: [conceptual, key_value]
    prompt: |
      What is a **key-value store**?
    answer: |
      A giant dictionary: you look up a value instantly by its key.

  - id: c41-4
    card: 41
    source_card: "What are document/KV stores?"
    origin: direct
    tags: [conceptual, key_value]
    prompt: |
      Give a use case for a key-value store.
    answer: |
      Caching, e.g. using Redis to remember whether a card is due.

  - id: c41-5
    card: 41
    source_card: "What are document/KV stores?"
    origin: direct
    tags: [conceptual, document_db, join]
    prompt: |
      Why might you embed related data in one document instead of joining tables?
    answer: |
      Embedding avoids JOINs and is fast to read as one unit (e.g. a card with its tags embedded).

  - id: c41-6
    card: 41
    source_card: "What are document/KV stores?"
    origin: direct
    tags: [conceptual, document_db, normalization, anomaly]
    prompt: |
      What is a downside of embedding, compared with relational normalization?
    answer: |
      The same embedded fact (e.g. a tag's description) can get duplicated across documents: the redundancy problem normalization solved, right back again.

  # ---------------------------------------------------------------- card 42
  - id: c42-1
