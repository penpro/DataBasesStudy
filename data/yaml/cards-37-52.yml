  - id: c48-2
    card: 48
    source_card: "Fluency with graph databases?"
    origin: inferred
    tags: [writing_prompt, graph_db]
    prompt: |
      Write a Cypher-style query that finds every course a student must take before "CS330", however many hops back.
    answer: |
      ```cypher
      MATCH (c:Course)-[:PREREQUISITE_OF*]->(:Course {title: 'CS330'})
      RETURN DISTINCT c.title;
      ```

  - id: c48-3
    card: 48
    source_card: "Fluency with graph databases?"
    origin: inferred
    tags: [conceptual, graph_db, relational, join]
    prompt: |
      How would the number of JOINs needed to find every prerequisite of a course, at any depth, compare in a relational schema with the graph version?
    answer: |
      The relational version needs one self-JOIN per hop, so a chain of unknown length can't be written as a fixed number of JOINs (it needs a recursive query). The graph query handles any depth.

  - id: c48-4
    card: 48
    source_card: "Fluency with graph databases?"
    origin: inferred
    tags: [writing_prompt, graph_db]
    prompt: |
      Write a Cypher-style query that finds courses with no incoming `PREREQUISITE_OF` edges (courses with no prerequisites).
    answer: |
      ```cypher
      MATCH (c:Course)
      WHERE NOT ( ()-[:PREREQUISITE_OF]->(c) )
      RETURN c.title;
      ```

  - id: c48-5
    card: 48
    source_card: "Fluency with graph databases?"
    origin: inferred
    tags: [design, relational, graph_db]
    prompt: |
      Sketch the course-prerequisite data as relational tables instead.
    answer: |
      A `courses` table (id, title) and a `prerequisites` table (course_id, prereq_id), both columns being foreign keys to `courses`.

  # ---------------------------------------------------------------- card 49
  - id: c49-1
    card: 49
    source_card: "Where does a DB fit in an app?"
    origin: direct
    tags: [conceptual, app_architecture]
    prompt: |
      Trace one request through a web app: where does the **database** sit relative to the **browser** and the **web server**?
    answer: |
      Browser -> web server (your application code) -> database -> back out as HTML or JSON. Only the web server talks to the database.

  - id: c49-2
    card: 49
    source_card: "Where does a DB fit in an app?"
    origin: direct
    tags: [conceptual, app_architecture]
    prompt: |
      Why is the database its own separate process, instead of part of the web server?
    answer: |
      Many web servers can share one database, and each can be restarted, moved, or scaled on its own.

  - id: c49-3
    card: 49
    source_card: "Where does a DB fit in an app?"
    origin: direct
    tags: [conceptual, app_architecture]
    prompt: |
      What is a **connection** in application code?
    answer: |
      An open session between application code and the database.

  - id: c49-4
    card: 49
    source_card: "Where does a DB fit in an app?"
    origin: direct
    tags: [conceptual, app_architecture]
    prompt: |
      Why do apps keep a **pool** of connections?
    answer: |
      Opening a connection is slow, so apps hold a pool of connections open and lend one to each request.

  - id: c49-5
    card: 49
    source_card: "Where does a DB fit in an app?"
    origin: direct
    tags: [conceptual, app_architecture, security]
    prompt: |
      Why should the browser never connect to the database directly?
    answer: |
      It would need the database password, and could then run *any* query, ignoring every rule the app enforces.

