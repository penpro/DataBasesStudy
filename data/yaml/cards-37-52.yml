  - id: c52-2
    card: 52
    source_card: "Fluency in databases?"
    origin: inferred
    tags: [conceptual, app_architecture]
    prompt: |
      Trace one feature of an app you've designed from the browser, through the web server, to the database and back.
    answer: |
      The browser sends a request; the web server runs the app code, which takes a connection from the pool and runs a parameterized query; the database returns rows; the server turns them into HTML or JSON; the browser displays them.

  - id: c52-3
    card: 52
    source_card: "Fluency in databases?"
    origin: inferred
    tags: [design, app_architecture]
    prompt: |
      Write a short pitch for an app's data architecture, covering the "why" behind each database choice.
    answer: |
      A good answer names each data store, says what kind of data and access pattern it serves, and justifies the choice (e.g. relational for the integrity-critical core, key-value for hot lookups).

  - id: c52-4
    card: 52
    source_card: "Fluency in databases?"
    origin: inferred
    tags: [conceptual, relational, document_db, key_value, graph_db]
    prompt: |
      Give an example of something that could go wrong if you chose the wrong database type for a feature.
    answer: |
      For example, storing a deep follower network in relational tables forces many JOINs and slow queries; using a key-value store for data that needs complex queries and constraints forces the app to implement them by hand.

  - id: c52-5
