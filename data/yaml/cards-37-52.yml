  - id: c50-3
    card: 50
    source_card: "Syntax for querying from app code?"
    origin: direct
    tags: [writing_prompt, app_architecture, select]
    prompt: |
      Write the server-side code behind `GET /decks/:id/cards`: connect, fetch that deck's cards with the id passed in as a parameter, and return them to the browser.
    answer: |
      ```text
      connection = connect("postgres://user:pass@localhost:5432/flashcards")

