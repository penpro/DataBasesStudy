  - id: c50-4
    card: 50
    source_card: "Syntax for querying from app code?"
    origin: inferred
    tags: [conceptual, security, app_architecture]
    prompt: |
      What is SQL injection?
    answer: |
      An attack where user input is glued into a query string so that the input is interpreted as SQL, letting the attacker run queries the app never intended.

  - id: c50-5
    card: 50
    source_card: "Syntax for querying from app code?"
    origin: inferred
    tags: [debugging, security, app_architecture]
    prompt: |
      What is dangerous about `"SELECT ... WHERE deck_id = " + params.id`, and what is the fix?
    answer: |
      User input becomes part of the SQL text, which allows SQL injection. Pass the value as a parameter instead (`WHERE deck_id = ?` with `[params.id]`) so it is always treated as data.

  # ---------------------------------------------------------------- card 51
  - id: c51-1
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, relational, document_db, key_value, graph_db]
    prompt: |
      Write out a checklist you'd use to pick relational vs. document vs. key-value vs. graph for a new feature.
    answer: |
      Ask: Is the data structured and does it need integrity (keys, constraints, complex queries)? -> relational. Is each item self-contained with a flexible shape? -> document. Is it a simple lookup by one key, needing speed? -> key-value. Are the relationships themselves the point, deep or variable-length? -> graph.

  - id: c51-2
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, key_value, document_db]
    prompt: |
      Which type of store would you pick for a shopping cart, and why?
    answer: |
      Key-value (or document): a cart is looked up by one key (the user or session) and read and written as a single unit, with no complex relationships.

  - id: c51-3
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, document_db, relational]
    prompt: |
      Which type of store would you pick for a product catalog, and why?
    answer: |
      Document (items have varying attributes and are read as one unit) or relational (if the catalog needs strong integrity and complex queries).

  - id: c51-4
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, graph_db]
    prompt: |
      Which type of store would you pick for a social network's "who follows whom", and why?
    answer: |
      Graph: the follow relationships are the data, and questions like "friends of friends" need multi-hop traversal.

  - id: c51-5
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, relational]
    prompt: |
      For the flashcard app, which database type would you assign to the catalog of decks, cards, tags, and reviews, and why?
    answer: |
      Relational: the data is structured, needs integrity (foreign keys, constraints), and supports complex queries.

  - id: c51-6
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, key_value]
    prompt: |
      For the flashcard app, which database type would you assign to a "card is due today" flag cache, and why?
    answer: |
      Key-value: a single fast lookup, with no relationships needed.

  - id: c51-7
    card: 51
    source_card: "Syntax for choosing a DB type?"
    origin: direct
    tags: [design, graph_db]
    prompt: |
      For the flashcard app, which database type would you assign to a prerequisite-chain feature ("what should I review before this card?"), and why?
    answer: |
      Graph: it needs deep, variable-length relationship traversal.

  # ---------------------------------------------------------------- card 52
  - id: c52-1
    card: 52
    source_card: "Fluency in databases?"
